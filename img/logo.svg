<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <defs>
    <!-- Background Canvas Gradient for Icon Badge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Solar Cell Gradient -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Cloud Body Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Scaled Emblem Icon on the Left (0 0 512 512 scaled down by 0.235) -->
  <g transform="translate(10, 10) scale(0.234)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
    <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.5"/>

    <g filter="url(#shadow)">
      <circle cx="345" cy="155" r="54" fill="url(#sunGrad)"/>
      <path d="M 345 74 L 345 92" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
      <path d="M 402 98 L 389 111" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
      <path d="M 426 155 L 408 155" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
      <path d="M 402 212 L 389 199" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <polygon points="120,335 392,335 348,205 164,205" fill="#0369A1" stroke="#0284C7" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="172,213 218,213 213,264 163,264" fill="url(#cellGrad)"/>
      <polygon points="224,213 288,213 288,264 220,264" fill="url(#cellGrad)"/>
      <polygon points="294,213 340,213 349,264 294,264" fill="url(#cellGrad)"/>
      <polygon points="160,272 212,272 206,327 131,327" fill="url(#cellGrad)"/>
      <polygon points="219,272 293,272 293,327 213,327" fill="url(#cellGrad)"/>
      <polygon points="300,272 352,272 381,327 301,327" fill="url(#cellGrad)"/>
      <polygon points="248,335 264,335 268,380 244,380" fill="#64748B"/>
      <rect x="225" y="376" width="62" height="10" rx="4" fill="#475569"/>
    </g>

    <g filter="url(#shadow)">
      <path d="M 140 375 
               A 38 38 0 0 1 122 305 
               A 48 48 0 0 1 185 260 
               A 62 62 0 0 1 285 272 
               A 42 42 0 0 1 335 325 
               A 36 36 0 0 1 315 375 
               Z" 
            fill="url(#cloudGrad)"/>
    </g>

    <circle cx="215" cy="336" r="4.5" fill="#0284C7"/>
    <path d="M 226 325 A 16 16 0 0 1 226 347" fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 236 316 A 28 28 0 0 1 236 356" fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Hoymiles Brand Title -->
    <text x="150" y="58" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">Hoymiles</text>
    
    <!-- SOLAR CLOUD Subtitle -->
    <text x="152" y="88" font-size="18" font-weight="700" fill="#0284C7" letter-spacing="3.5px">SOLAR CLOUD</text>

    <!-- Platform Sub-badge / Description -->
    <text x="152" y="112" font-size="13" font-weight="500" fill="#64748B" letter-spacing="0.8px">Home Assistant Integration</text>
  </g>
</svg>

