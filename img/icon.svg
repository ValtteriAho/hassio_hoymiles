<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Solar Cell Blue Gradient -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Cloud Body Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="3" opacity="0.5"/>

  <!-- Sun with Radiant Rays -->
  <g filter="url(#shadow)">
    <circle cx="345" cy="155" r="54" fill="url(#sunGrad)"/>
    <!-- Sun Rays -->
    <path d="M 345 74 L 345 92" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 402 98 L 389 111" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 426 155 L 408 155" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 402 212 L 389 199" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 345 236 L 345 218" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 288 212 L 301 199" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Perspective Solar Panel Assembly -->
  <g filter="url(#shadow)">
    <!-- Panel Aluminum Frame -->
    <polygon points="120,335 392,335 348,205 164,205" fill="#0369A1" stroke="#0284C7" stroke-width="4" stroke-linejoin="round"/>

    <!-- Solar Cells Top Row -->
    <polygon points="172,213 218,213 213,264 163,264" fill="url(#cellGrad)"/>
    <polygon points="224,213 288,213 288,264 220,264" fill="url(#cellGrad)"/>
    <polygon points="294,213 340,213 349,264 294,264" fill="url(#cellGrad)"/>

    <!-- Solar Cells Bottom Row -->
    <polygon points="160,272 212,272 206,327 131,327" fill="url(#cellGrad)"/>
    <polygon points="219,272 293,272 293,327 213,327" fill="url(#cellGrad)"/>
    <polygon points="300,272 352,272 381,327 301,327" fill="url(#cellGrad)"/>

    <!-- Mounting Leg & Support Base -->
    <polygon points="248,335 264,335 268,380 244,380" fill="#64748B"/>
    <rect x="225" y="376" width="62" height="10" rx="4" fill="#475569"/>
  </g>

  <!-- Modern Fluffy Cloud (S-Miles Cloud Symbol) -->
  <g filter="url(#shadow)">
    <path d="M 140 375 
             A 38 38 0 0 1 122 305 
             A 48 48 0 0 1 185 260 
             A 62 62 0 0 1 285 272 
             A 42 42 0 0 1 335 325 
             A 36 36 0 0 1 315 375 
             Z" 
          fill="url(#cloudGrad)"/>
  </g>

  <!-- Telemetry / Signal Waves inside Cloud -->
  <g>
    <!-- Dot -->
    <circle cx="215" cy="336" r="4.5" fill="#0284C7"/>
    <!-- Wave 1 -->
    <path d="M 226 325 A 16 16 0 0 1 226 347" fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Wave 2 -->
    <path d="M 236 316 A 28 28 0 0 1 236 356" fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>

